version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: ${SMARTHOME_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SMARTHOME_DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d smarthome" ]
      interval: 3s
      timeout: 1s
      retries: 3
      start_period: 3s
    networks:
      - smarthome-network

  device-db:
    image: postgres:16-alpine
    container_name: device-db
    environment:
      POSTGRES_DB: device_db
      POSTGRES_USER: ${DEVICE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DEVICE_DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - device_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d device_db" ]
      interval: 3s
      timeout: 1s
      retries: 3
      start_period: 3s
    networks:
      - smarthome-network

  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    container_name: device-service
    depends_on:
      device-db:
        condition: service_healthy
    environment:
      - R2DBC_URL=${R2DBC_URL:-r2dbc:postgresql://device-db:5432/device_db}
      - JDBC_URL=${JDBC_URL:-jdbc:postgresql://device-db:5432/device_db}
    ports:
      - "8082:8082"
    networks:
      - smarthome-network

  telemetry-db:
    image: timescale/timescaledb:2.16.1-pg14-oss
    container_name: telemetry-db
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: ${TELEMETRY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - telemetry_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d telemetry_db" ]
      interval: 3s
      timeout: 1s
      retries: 3
      start_period: 3s
    networks:
      - smarthome-network

  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: telemetry-service
    depends_on:
      telemetry-db:
        condition: service_healthy
    environment:
      - R2DBC_URL=${R2DBC_URL:-r2dbc:postgresql://telemetry-db:5432/telemetry_db}
      - JDBC_URL=${JDBC_URL:-jdbc:postgresql://telemetry-db:5432/telemetry_db}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-tcp://mqtt:1883}
    ports:
      - "8083:8083"
    networks:
      - smarthome-network

  temperature-api:
    build: ./temperature-api
    container_name: temperature-api
    ports:
      - "8081:8081"
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      device-service:
        condition: service_started
      telemetry-service:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - DEVICE_SERVICE_API=http://device-service:8082
      - TELEMETRY_SERVICE_API=http://device-service:8083
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:
  device_db_data:
  telemetry_db_data:

networks:
  smarthome-network:
    driver: bridge