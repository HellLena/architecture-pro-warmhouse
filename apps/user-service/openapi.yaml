openapi: 3.0.3
info:
  title: Smart Home - User Service API
  version: 1.0.0
servers:
  - url: /api/v1
tags:
  - name: user-controller
paths:
  /authenticate:
    post:
      tags: [user-controller]
      summary: Авторизация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authCode]
              properties:
                authCode: { type: string }
      responses:
        '200':
          description: успешно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: не авторизован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{userId}:
    get:
      tags: [user-controller]
      summary: Получение информации о пользователе
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: number }
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  schemas:
    User:
      type: object
      required: [id]
      properties:
        id: { type: number }
        providerId: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: User not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
